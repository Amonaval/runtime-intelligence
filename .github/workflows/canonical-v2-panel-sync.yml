name: Canonical v2 panel sync

on:
  push:
    branches:
      - mission-10f-v2-rebase
    paths:
      - .github/workflows/canonical-v2-panel-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mission-10f-v2-rebase
          fetch-depth: 0

      - name: Restore canonical v2 replay event
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('lit/src/panel/LdsDebugPanel.js')
          text = path.read_text(encoding='utf-8')
          event = """        this.dispatchEvent(new CustomEvent('lds-replay-complete', {\n            detail: { comparison: comp, status: 'done' },\n            bubbles: true,\n            composed: true,\n        }));\n"""
          if "new CustomEvent('lds-replay-complete'" not in text:
              old = """        if (comp) this._verifiedIssues = { ...this._verifiedIssues, [this._replayState.issueId]: { comparison: comp, verifiedAt: comp.comparedAt } };\n        this.requestUpdate();\n    }\n\n    _cancelReplay() {\n"""
              new = """        if (comp) this._verifiedIssues = { ...this._verifiedIssues, [this._replayState.issueId]: { comparison: comp, verifiedAt: comp.comparedAt } };\n        this.requestUpdate();\n""" + event + """    }\n\n    _cancelReplay() {\n"""
              if old not in text:
                  raise SystemExit('Expected _completeReplay anchor not found; refusing to patch.')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          expected = '1cdc054f6d368a3fd9e0a3e2262d22f207b35943'
          if actual != expected:
              raise SystemExit(f'Canonical hash mismatch: {actual} != {expected}')
          print(f'Canonical panel hash verified: {actual}')

      - name: Commit canonical panel only
        run: |
          if git diff --quiet -- lit/src/panel/LdsDebugPanel.js; then
            echo "Panel already canonical"
            exit 0
          fi
          git config user.name "AMOL NAVAL"
          git config user.email "amol.naval89@gmail.com"
          git add lit/src/panel/LdsDebugPanel.js
          git commit -m "fix: restore canonical v2 replay completion event"
          git push origin HEAD:mission-10f-v2-rebase
