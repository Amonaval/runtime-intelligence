name: Mission 10F v2 validation

on:
  push:
    branches:
      - mission-10f-v2-rebase
    paths:
      - .github/workflows/mission-10f-v2-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mission-10f-v2-rebase
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Canonical source assertions
        run: |
          test "$(git hash-object src/panel/LdsDebugPanel.js)" = "1cdc054f6d368a3fd9e0a3e2262d22f207b35943"
          grep -q "causedByEventId: pending.networkEventId" src/integration/lit/network-state-correlator.js
          grep -q "new CustomEvent('lds-replay-complete'" src/panel/LdsDebugPanel.js
          node -e "const p=require('./package.json'); if(p.peerDependencies?.lit!=='>=3.0.0'||p.peerDependenciesMeta?.lit?.optional!==undefined) process.exit(1)"
      - run: npm test
      - run: npm run test:smoke
      - run: npm run build:lib
